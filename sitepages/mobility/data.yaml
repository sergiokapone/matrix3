title: Академічна мобільність
page_id: 411
hero: https://apd.ipt.kpi.ua/wp-content/uploads/2026/11/mobility-hero.jpg
# інтро — готовий html (посилання)
intro: 'Навчання в КПІ забезпечує студентам не лише якісну вищу освіту, а й передбачає можливість здобути досвід навчання або стажування за кордоном (зовнішня мобільність) та в межах України (національна або внутрішня мобільність) (п. 2 ч. 1 ст. 1 <a href="https://osvita.ua/legislation/law/2235/">Закону України «Про вищу освіту»</a>). Інформацію щодо мобільності, її видів та порядку її оформлення можна дізнатися на сайті <a href="https://mobilnist.kpi.ua/" target="_blank" rel="noopener">Відділу академічної мобільності</a>. З більш детальною інформацією можна також ознайомитися в оновленому <a href="https://osvita.kpi.ua/ppam">Положенні про академічну мобільність</a> за 2025 рік.'
services_title: Послуги відділу академічної мобільності
services:
- Консультація студентів про наявні програми обміну та стажування, допомога з оформленням документів в університеті.
- Інформаційні заходи про академічну мобільність, стажування та волонтерства як від представників відділу, так і у співпраці з партнерами.
- Відділ займається укладанням угод з новими закордонними та українськими університетами, а також підтримує вже існуючі міжуніверситетські зв’язки.
