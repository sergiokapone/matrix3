title: Лабораторія «Фізика новітніх технологій»
page_id: 293
intro: Науково-дослідна (експериментальна) лабораторія «<strong>Фізика новітніх технологій</strong>» («ФіНоТех») є структурним підрозділом НН ФТІ (наказ № НУ/265/2021 від 07.12.2021).
passport: https://apd.ipt.kpi.ua/kafedra/passport-finotex.pdf
people:
- role: Науковий керівник
  post: завідувач кафедри
  name: Монастирський Г.Є.
  url: https://apd.ipt.kpi.ua/kafedra/stuff/monastyrsky/
  photo: https://apd.ipt.kpi.ua/wp-content/uploads/2024/09/MGE-264x300.jpg
- role: Завідувач лабораторії
  post: доцент кафедри
  name: Іванова В.В.
  url: https://apd.ipt.kpi.ua/kafedra/stuff/ivanova/
  photo: https://apd.ipt.kpi.ua/wp-content/uploads/2026/03/Ivanova_VV.jpg
mission: Лабораторія «ФіНоТех» — творче середовище для реалізації наукових ідей та проєктів за напрямками
directions:
- фізичних основ розробки і застосування наноматеріалів та матеріалів з унікальними властивостями
- нанотехнологій, квантових матеріалів та квантових технологій
- розробки методологій і засобів контролю фізичних процесів, технологій виробництва і впровадження новітніх матеріалів і структур
- фізики новітніх та альтернативних джерел енергії, енерго- і ресурсозберігаючих технологій
- фізичних засад підвищення ефективності традиційних джерел енергії та енергетичних систем
- проблем самоорганізації та функціонування живих систем
- проблем нейрофізики, нейрохімії та електрофізіології
tasks:
- Створення творчого середовища для залучення до науково-дослідної та інноваційної діяльності викладачів та здобувачів вищої освіти.
- Забезпечення використання матеріально-технічної бази в межах науково-дослідних робіт викладачів та здобувачів вищої освіти.
- 'Сприяння експериментальним дослідженням в роботі <a href="http://apd.ipt.kpi.ua/nauka/naukovi_gurtki/">студентських наукових гуртків</a>.'
- Розробка навчальних лабораторних робіт, експериментальних стендів та демонстрацій і впровадження їх в навчальний процес.
demo_caption: Демонстрація — мендосинський двигун
video: '[video width="800" height="800" mp4="https://apd.ipt.kpi.ua/wp-content/uploads/2025/02/Мендосинський-мотор.mp4" loop="true" autoplay="true" preload="auto"][/video]'
functions:
- title: Проведення науково-дослідних експериментальних робіт за участю викладачів та здобувачів вищої освіти
  text: Лабораторія — це місце, де викладачі та студенти об’єднують свої зусилля для вивчення і дослідження новітніх фізичних технологій у галузі прикладної фізики.
  photos:
  - https://apd.ipt.kpi.ua/wp-content/uploads/2025/02/IMG_5858-resize-300x200.jpg
  - https://apd.ipt.kpi.ua/wp-content/uploads/2025/01/image_2025-01-14_20-41-07-300x200.png
- title: Проведення науково-дослідної роботи студентів за темами кваліфікаційних робіт
  text: В лабораторії студентам завжди підкажуть, покажуть і навчать, як і що робити.
  photos:
  - https://apd.ipt.kpi.ua/wp-content/uploads/2025/02/IMG_5853-resize-300x200.jpg
  - https://apd.ipt.kpi.ua/wp-content/uploads/2025/02/photo-1-300x200.jpg
- title: Поліпшення якості освітнього процесу
  text: 'Організація роботи <a href="http://apd.ipt.kpi.ua/nauka/naukovi_gurtki/">студентських наукових гуртків</a>; створення всім учасникам освітнього процесу безпечних умов праці.'
- title: Придбання й підтримання в належному технічному стані приладів, обладнання та матеріалів
  text: 'Для виконання науково-дослідних робіт — <a href="http://apd.ipt.kpi.ua/kafedra/matherial_stuff/">перелік приладів, обладнання та матеріалів</a>.'
