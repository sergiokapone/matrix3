  biography: 'Сергій Миколайович Пономаренко, кандидат фізико-математичних наук, доцент. Народився 12 грудня 1978 року в селі
    Пересадівка Жовтневого району Миколаївської області. У 2001 році закінчив Миколаївський державний педагогічний університет
    за спеціальністю "Фізика" (магістр). У 2005 році здобув ступінь кандидата фізико-математичних наук у Інституті хімії високомолекулярних
    сполук НАН України (спеціальність – 01.04.19 – фізика полімерів). З 2005 року працював на посадах асистента та доцента
    кафедри фізики КНУБА. У 2011 отримав вчене звання доцента. З 2014 року працює на посаді доцента кафедри прикладної фізики
    НН ФТІ НТУУ "Київський політехнічний інститут імені Ігоря Сікорського".

    '
