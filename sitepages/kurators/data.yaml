title: Куратори студентських груп
page_id: 7375
intro: 'Куратор — це викладач, до якого студенти можуть звернутися з будь-якими питаннями: навчальними, організаційними, побутовими чи особистими. Куратор допомагає адаптуватися до університетського життя, вирішує конфліктні ситуації, стежить за успішністю групи, організовує позанавчальні заходи та завжди готовий підтримати своїх студентів.'
