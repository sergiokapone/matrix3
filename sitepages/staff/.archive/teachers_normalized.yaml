  biography: 'В 1984 році закінчив Московський фізико-технічний інститут (факультет Проблем фізики та енергетики) за спеціальністю
    «Автоматика і електроніка». В 1984–1985 працював в Інституті металофізики ім. Г.В. Курдюмова НАН України стажером-дослідником.
    З 1985 по 1989 заочно навчався в аспірантурі Інституту металофізики ім. Г.В. Курдюмова НАН України. В 1990 році захистив
    кандидатську дисертацію «Мартенситне перетворення та ефект пам''яті форми в легованих сплавах на основі Fe-Ni» (спеціальність:
    фізика твердого тіла). З 1991 по 1995 — науковий співробітник Інституту металофізики НАН України. В 1995 перейшов до НТУУ
    «КПІ», де брав активну участь в організації фізико-технічного інституту та розвитку навчальних лабораторій із загальної
    фізики. З 1997 по 2010 — заступник завідувача кафедри «Прикладна фізика» ФТІ НТУУ КПІ. До 2014 року за сумісництвом —
    старший науковий співробітник відділу фазових перетворень Інституту металофізики НАН України. З 2010 по 2021 — заступник
    директора ФТІ з міжнародної діяльності. В 2020 році захистив докторську дисертацію «Закономірності фазових структурних
    перетворень в неоднорідних, нерівноважних і просторово обмежених станах функціональних матеріалів» (спеціальність: фізика
    металів). З 2021 року — завідувач кафедри прикладної фізики ФТІ КПІ ім. Ігоря Сікорського.

    '
