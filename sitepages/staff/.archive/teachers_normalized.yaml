    синаптичної передачі новими агентами для тераностики нейропатологій; роль пресинаптичних рецепторів та природних мембранотропних
    сполук. Дослідження охоплюють космічну біологію (токсичність планетарного пилу), нанотехнології (нейроактивні наночастинки)
    та екологічну нейротоксикологію (важкі метали Pb, Cd, Hg, Cu, карбонові частинки). Керівник проєктів Національного фонду
    досліджень України. За 2020–2025 рр. опубліковано статті у журналах Q1–Q2 (PLOS ONE, Food and Chemical Toxicology, Environmental
    Science and Pollution Research тощо).

