  - student: Катющева Віолєтта Олександрівна
    title: Вплив особливостей будови і атомного складу, що обумовлюють топологічні ефекти, на електронну структуру та фізичні властивості сплавів Гейслера
    advisors:
    - Загородній В.В.
    annotation:
    - label: Мета роботи
      text: Шляхом проведення першопринципних розрахунків електронної структури, аналізу літератури, визначити топологічні сплави Гейслера, придатні для використання
        в пристроях спінтроніки і сенсорики, в яких існує високий ступінь спінової поляризації електронів провідності на рівні Фермі, спостерігається значний магнітний
        момент, існує структурна нестабільність та змінний атомний склад.
    - label: Очікувані результати
      text: Запропоновані дослідження дадуть змогу отримати новітні дані для поглиблення та розвитку нової концепції структурно-фазових перетворень при формуванні
        наноструктурованих спінтроних і топологічних сплавів Гейслера.
  - student: Козачук Всеволод Олександрович
    title: Кварк-глюонна структура амплітуд зміни спіральності у пружному електрон-дейтронному розсіянні
    advisors:
    - Кривенко-Еметов Я.Д.
    annotation:
    - label: Мета роботи
      text: Дослідити внесок кварк-глюонних механізмів у формування амплітуд зміни спіральності та спостережуваних характеристик пружного електрон-дейтронного розсіяння
        в області проміжних переданих імпульсів. Особливу увагу приділити морським кваркам, міжкварковим кореляціям та кварковій кластеризації.
    - label: Очікувані результати
      text: Порівняти передбачення фізично обґрунтованих наближень для амплітуд зміни спіральності з експериментальними даними, оцінити відносну роль розглянутих
        механізмів та уточнити уявлення про внутрішню кварк-глюонну структуру дейтрона.
  - student: Мунтіян Анастасія Андріївна
    title: Квантово-статистичні ефекти та взаємодії квазічастинок у сильно взаємодіючій адронній матерії поблизу КХД-кросоверу
    advisors:
    - Кривенко-Еметов Я.Д.
    annotation:
    - label: Мета роботи
      text: Дослідити вплив принципу Паулі та міжчастинкових взаємодій на термодинамічні властивості сильно взаємодіючої матерії поблизу КХД-кросоверу. Розглянути
        узагальнення багатокомпонентної моделі Ван дер Ваальса з урахуванням ефективних ступенів вільності, хімічних потенціалів і переходу від больцманівського до
        квантово-виродженого режиму.
    - label: Очікувані результати
      text: Отримати модельні вирази для рівняння стану з урахуванням поправок, пов’язаних із принципом Паулі, та взаємодій квазічастинок. Порівняти фізично обґрунтовані
        наближення й оцінити їхній вплив на тиск, віріальні коефіцієнти та інші термодинамічні характеристики поблизу КХД-кросоверу.
  - student: Петушенко Роман Ігорович
    title: Вплив зниження системної інерції на динамічну стійкість енергомереж при інтеграції відновлюваних джерел енергії
    advisors:
    - Ольховик І.В.
    annotation:
    - label: Мета роботи
      text: 'Робота присвячена зниженню динамічної стійкості енергомереж через масове впровадження інверторних відновлюваних джерел енергії (СЕС та ВЕС), які не мають
        фізичної механічної інерції. В основі дослідження лежить комплексний підхід: моделювання локальної стійкості за допомогою системи «генератор — нескінченна
        шина» (SMIB) та аналіз глобальної мережевої синхронізації з використанням моделі зв’язаних нелінійних осциляторів Курамото.'
    - label: Очікувані результати
      text: Шляхом чисельного інтегрування аварійних режимів проаналізовано зміну області притягання стабільного стану на фазових портретах і доведено, що зменшення
        еквівалентної інерції суттєво скорочує критичний час відключення аварії. Додатково, застосування моделі Курамото дозволило дослідити вразливість системи до
        каскадних відмов та визначити умови, за яких локальне збурення призводить до глобальної втрати синхронізму (блекауту). Отримані результати підтверджують необхідність
        підвищення швидкодії систем захисту, впровадження технологій «синтетичної інерції» та врахування топологічних особливостей мережі при підключенні нових джерел
        генерації.
  - student: Повшенюк Ярослав Віталійович
    title: Вплив зовнішнього електричного поля на поляризовність і гіперполяризовність малих молекул
    advisors:
    - Пономаренко С.М.
    annotation:
    - label: Мета роботи
      text: Реалізувати автоматизований підхід скінченного поля для розрахунку статичних поляризовності α та першої гіперполяризовності β малих молекул у пакеті PySCF,
        систематично порівняти методи HF, DFT і MP2 та оцінити похибки чисельного диференціювання.
    - label: Задачі
      items:
      - Розробити процедуру внесення зовнішнього електричного поля в одночастинковий гамільтоніан у PySCF.
      - Реалізувати чисельне обчислення α та β методом центральних різниць і поліноміального фіту.
      - Дослідити збіжність результатів за кроком поля h та визначити оптимальні параметри FF-процедури.
      - Виконати розрахунки α та β для молекул H₂O, CO₂, NH₃, CH₄ методами HF, B3LYP і MP2 у базисах cc-pVDZ, aug-cc-pVDZ, aug-cc-pVTZ.
      - Оцінити можливість обчислення другої гіперполяризовності γ як факультативної задачі.
      - Сформулювати методичні рекомендації щодо вибору базису та кроку поля.
    - label: Об’єкт дослідження
      text: Електронна структура малих молекул у зовнішньому статичному електричному полі.
    - label: Предмет дослідження
      text: Статичні поляризовність α та гіперполяризовність β, їхня залежність від методу розрахунку, базисного набору та кроку диференціювання.
    - label: Методи дослідження
      text: Метод скінченного поля; чисельне диференціювання; методи електронної структури Hartree–Fock, DFT (B3LYP), MP2; програмна реалізація на Python у PySCF.
    - label: Практичне значення
      text: Отримані результати та скрипт можуть бути використані для розрахунку нелінійно-оптичних властивостей молекулярних систем та у навчальному процесі.
  - student: Семенков Денис Сергійович
    title: Обґрунтування побудови малогабаритної SAR-системи на базі Acconeer A121
    advisors:
    - Іванова В.В.
    annotation:
    - label: Задачі
      items:
      - Провести аналіз сучасних SAR-систем та огляд класичних алгоритмів реконструкції радіолокаційних зображень (Backprojection, Range-Doppler, Omega-K).
      - Аналіз принципу дії радара Acconeer A121, вивчити методи визначення дальності та фазових змін, оцінити можливості використання A121 у задачах когерентної
        радіолокації та SAR.
      - 'Аналіз методів покращення SAR-зображень: дослідити природу спекл-шуму в когерентних радіолокаційних системах; проаналізувати проблему неоднозначності фази
        (phase wrapping); виконати огляд сучасних методів обробки SAR-зображень на основі штучного інтелекту.'
      - Проаналізувати можливість застосування PINN в SAR.
      - 'Виконати постановку задачі для PINN: визначити вхідні та вихідні дані нейронної мережі; сформувати фізичні обмеження (physics constraints), які будуть використані
        під час навчання; обрати критерії оцінювання якості реконструкції та фільтрації SAR-зображень.'
  - student: Тєрєхова Руслана Ігорівна
    title: Методи дослідження та показники якості ПІД-регулювання систем кутової стабілізації БПЛА
    advisors:
    - Монастирський Г.Є.
    - Степаненко В.М.
    annotation:
    - label: Мета роботи
      text: Обґрунтувати структуру навчально-дослідного стенда для вивчення кутової стабілізації БПЛА, визначити методи оцінювання якості ПІД-регулювання.
    - label: Об’єкт дослідження
      text: Система кутової стабілізації багатороторного БПЛА.
    - label: Предмет дослідження
      text: Вплив параметрів ПІД-регулятора, характеристик вимірювального каналу та динаміки об’єкта на точність і якість кутової стабілізації.
    - label: Задачі
      items:
      - Зробити літературний огляд, в якому розглянути екосистеми програмних платформ для розроблення, налагодження та тестування алгоритмів контролерів польоту,
        зробити порівняльний аналіз систем типу Firmware + Configurator для прошивок контролера, налаштування датчиків, регуляторів, аналізу телеметрії (INAV, Betaflight,
        ArduPilot). На цій основі обґрунтувати вибір платформи для роботи з експериментальним стендом. Порівняти можливі конструкції та приклади експериментальних
        стендів й обґрунтувати вибір базового варіанта.
      - Розглянути принципи керування орієнтацією багатороторного БПЛА та структуру його системи стабілізації. Проаналізувати призначення контурів регулювання кута
        й кутової швидкості та принцип їхнього каскадного з’єднання. Розглянути можливості IMU та інших давачів, зокрема для оцінювання орієнтації у просторі, фіксування
        поточного положення, інтегрування показань гіроскопа, принцип і застосування комплементарної фільтрації та фільтрації Кальмана.
      - Опанувати програмні платформи INAV, Betaflight для визначення показників, за якими можна порівнювати налаштування регулятора та результати експериментів,
        оцінки впливу таких чинників, як шуму вимірювань, затримки, фільтрації або насичення керувального сигналу.
      - Побудувати спрощену математичну модель стабілізації за однією віссю та дослідити вплив коефіцієнтів ПІД-регулятора, вплив затримки в каналі зворотного зв’язку,
        вплив шуму і фільтрації.
      - Запропонувати незалежний канал вимірювання кута(ів) та методику зіставлення його(їх) показань із даними польотного контролера та виконати пробні експерименти
        з непрацюючими гвинтами.
