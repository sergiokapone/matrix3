  biography: 'Закінчив Казанський авіаційний інститут (КАІ). Його перше дослідження, присвячене новим системам охолодження
    ракетних двигунів, було удостоєне диплому Міністра вищої та середньої освіти РРФСР (1966). У 1970 році захистив кандидатську
    дисертацію, а в 1977 році — докторську, присвячені термогазодинаміці інтенсивних систем охолодження високотемпературних
    двигунів літальних апаратів. З червня 1978 року працює в Інституті технічної теплофізики НАН України: спочатку старшим
    науковим співробітником, з 1983 року — завідувачем відділу, у 1986–1994 роках — заступником директора з наукової роботи.
    У 1981 році присвоєно вчене звання професора, у 1990 році обрано членом-кореспондентом НАН України, у 2000 році — академіком.
    В ІТТФ НАН України очолив науковий напрямок у галузі тепломасообміну та гідродинаміки в полях відцентрових масових сил.
    Автор і співавтор 12 монографій, кількох підручників, понад 300 наукових статей (80 опубліковано за кордоном), більш ніж
    80 авторських свідоцтв і патентів. Серед найважливіших монографій: «Теплообмін, масообмін і гідродинаміка закручених потоків
    в осесиметричних каналах» (1982), «Теорія і практика закручених потоків» (1989), «Термогазодинаміка складних потоків біля
    криволінійних поверхонь» (1999), чотиритомна монографія «Теплообмін і гідродинаміка в полях відцентрових масових сил»
    (1996–2000). У 1992 році присуджено премію НАН України ім. Г. Ф. Проскури, у 1995 році обрано дійсним членом Аерокосмічної
    академії України, у 1996 році — Почесним професором Університету м. Кардіфф (Велика Британія). У 2002 році отримав перший
    приз Наукового комітету НАТО. Під його керівництвом підготовлено 29 кандидатів наук, двоє з яких захистили докторські
    дисертації. З 2 серпня 2011 року очолював кафедру Фізики енергетичних систем ФТІ КПІ ім. Ігоря Сікорського.

    '
