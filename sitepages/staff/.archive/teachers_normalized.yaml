  biography: 'Закінчив фізичний факультет Київського державного університету у 1972 році. Кандидат фізико-математичних наук
    (1974), тема дисертації: «Дослідження рівнянь руху в релятивістській динаміці взаємодіючих частинок». Доктор фізико-математичних
    наук (1992), тема дисертації: «Методи наближеного і якісного аналізу в релятивістській динаміці». У Київському університеті
    з 1988 року. З 1997 року — завідувач відділу астрофізики та фізики Сонця (з 2001 року — відділ астрофізики) астрономічної
    обсерваторії КНУ ім. Тараса Шевченка. Лауреат Державної премії України в галузі науки і техніки (2014). Академік АН вищої
    школи України. Член Міжнародної астрономічної спілки. Підготував спеціальні курси із загальної теорії відносності, космології,
    синергетики в астрономії для фізичного факультету КНУ ім. Тараса Шевченка.

    '
