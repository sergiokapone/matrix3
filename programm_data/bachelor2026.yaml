metadata:
  title: Освітньо-професійна програма "Прикладна фізика"
  university: НТУ "КПІ ім. Ігоря Сікорського"
  faculty: НН Фізико-технічний інститут
  department: Кафедра прикладної фізики
  field: E Природничі науки, математика та статистика
  specialty: E6 Прикладна фізика та наноматеріали
  website: https://osvita.kpi.ua/sites/default/files/oop/e6_oppb_pf_2026.pdf
