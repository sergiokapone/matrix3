  biography: 'Закінчив Київський політехнічний інститут у 1973 році за спеціальністю: електронні прилади та пристрої, кваліфікація:
    інженер електронної техніки. Після закінчення інституту 2 роки служив в лавах Радянської армії. З 1 квітня 1975 року працює
    в КПІ на посадах молодший науковий співробітник, старший науковий співробітник, заступник проректора з наукової роботи,
    завідувач кафедри прикладної фізики. Навчався в аспірантурі в 1975–1978 роках. Захистив кандидатську дисертацію у 1981
    році, докторську дисертацію у 1997 році, професор з 2004 року. Доктор технічних наук (1997) за спеціальністю: 05.27.01
    — Твердотільна електроніка; 05.27.02 — Вакуумна, плазмова та квантова електроніка. Тема дисертації: «Оптимізація параметрів
    реверсивних матеріалів, що використовуються для запису, збереження та відображення інформації». Завідувач кафедри прикладної
    фізики з 2002 по 2021 рр., з 2021 до теперішнього часу — професор даної кафедри. Підготував двох кандидатів наук та одного
    доктора наук. Член двох спеціалізованих Вчених рад із захисту докторських дисертацій (Д 26.002.08 та Д 26.002.18); Член
    Науково-експертної ради МОН України; Член Експертної Ради МОН України з атестації наукових кадрів; Заступник голови НМК(П)
    105 «Прикладна фізика та наноматеріали»; Голова технічної ради та член науково-інноваційної комісії Вченої ради КПІ ім.
    Ігоря Сікорського; Голова науково-методичної комісії КПІ ім. Ігоря Сікорського зі спеціальності 105 «Прикладна фізика
    та наноматеріали».

    '
